<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum</title>
    <link href="../LAYOUT/CSS/ŞifremiUnuttum.css" rel="stylesheet">
		<link rel="icon" href="../İMAGES/mp3.and.mp4/ŞifreUnuttum.png" sizes="32x32" type="image/png">

</head>
<body>

    <div class="reset-container">
        <h2>Şifremi Unuttum</h2>
        <form action="reset-password.html" method="POST" class="reset-form">
            <div class="input-group">
                <label for="email">E-posta</label>
                <input type="email" id="email" name="email" placeholder="E-posta adresinizi girin" required>
            </div>

            <button type="submit" class="btn">Şifre Sıfırlama Bağlantısı Gönder</button>

            <div class="footer-links">
                <p>Hesabınız var mı? <a href="Giriş Yap.html">Giriş Yapın</a></p>
            </div>
        </form>
    </div>

</body>
</html>
