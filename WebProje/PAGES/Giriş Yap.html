<!DOCTYPE html>
<html lang="tr">
<meta charset="UTF-8">
<head>
    <meta charset="UTF-8">
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="../İMAGES/mp3.and.mp4/GirişYap.jpg" sizes="32x32" type="image/png">
    <title>Giriş Yap</title>
  
	<link href="../LAYOUT/CSS/login.css" rel="stylesheet">
</head>
<body>
<div id="genel">

    <div class="login-container">
        <h2>Giriş Yap</h2>
        <form action="dashboard.html" method="POST" class="login-form">
            <div class="input-group">
                <label for="email">E-posta</label>
                <input type="email" id="email" name="email" placeholder="E-posta adresinizi girin" required>
            </div>

            <div class="input-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" name="password" placeholder="Şifrenizi girin" required>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember-me" name="remember">
                <label for="remember-me">Beni Hatırla</label>
            </div>

            <button type="submit" class="btn">Giriş Yap</button>

            <div class="footer-links">
                <a href="ŞifremiUnuttum.html">Şifremi Unuttum?</a>
                <p>Hesabınız yok mu? <a href="register.html">Kayıt Olun</a></p>
            </div>
        </form>
    </div>

</body>
</html>
