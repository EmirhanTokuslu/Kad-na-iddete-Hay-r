<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol</title>
    <link href="../LAYOUT/CSS/Register.css" rel="stylesheet">
			<link rel="icon" href="../İMAGES/mp3.and.mp4/KayıtOl.png" sizes="32x32" type="image/png">

</head>
<body>

    <div class="register-container">
        <h2>Kayıt Ol</h2>
        <form action="login.html" method="POST" class="register-form">
            <div class="input-group">
                <label for="name">Ad Soyad</label>
                <input type="text" id="name" name="name" placeholder="Adınızı ve Soyadınızı girin" required>
            </div>

            <div class="input-group">
                <label for="email">E-posta</label>
                <input type="email" id="email" name="email" placeholder="E-posta adresinizi girin" required>
            </div>

            <div class="input-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" name="password" placeholder="Şifrenizi girin" required>
            </div>

            <div class="input-group">
                <label for="confirm-password">Şifreyi Onayla</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Şifrenizi tekrar girin" required>
            </div>

            <button type="submit" class="btn">Kayıt Ol</button>

            <div class="footer-links">
                <p>Zaten hesabınız var mı? <a href="Giriş Yap.html">Giriş Yapın</a></p>
            </div>
        </form>
    </div>

</body>
</html>
